name: Release dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    # No secrets are passed to the validation workflow.

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    # Configure this environment to allow only main before the first release.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned flyctl
        # Upstream setup-flyctl's latest tagged release still uses Node 20.
        # Verify the official CLI artifact directly instead of using a moving action.
        env:
          FLYCTL_VERSION: "0.4.108"
          FLYCTL_SHA256: "38173df9dadd6a1f413ce435b6745b29ce2893c0ba918af17d7a1eced8089844"
        run: |
          tool_dir="$RUNNER_TEMP/flyctl"
          mkdir -p "$tool_dir"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz" \
            --output "$tool_dir/flyctl.tar.gz"
          echo "$FLYCTL_SHA256  $tool_dir/flyctl.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/flyctl.tar.gz" -C "$tool_dir" flyctl
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Deploy validated dashboard revision
        run: flyctl deploy --remote-only
        env:
          # Environment-scoped credential; retire the old repository-wide token.
          FLY_API_TOKEN: ${{ secrets.FLY_PRODUCTION_API_TOKEN }}
