name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: Run dashboard browser tests (requires Chromium and CDN access)
        type: boolean
        default: false
      run_live_tests:
        description: Run live portal tests only after source access has been qualified
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_browser_tests:
        type: boolean
        default: false
      run_live_tests:
        type: boolean
        default: false

concurrency:
  # Reused release checks must not cancel, or be cancelled by, ordinary CI.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.7"
  # The installer must know this Python release on a clean hosted runner.
  UV_VERSION: "0.12.19"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github src tests scripts/summarize_test_profile.py scripts/check_doc_links.py
      - run: uv run ruff format --check src tests scripts/summarize_test_profile.py scripts/check_doc_links.py

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run mypy src

  test:
    runs-on: ubuntu-24.04
    # Retain headroom for shared-runner variance. Timing artifacts distinguish
    # setup, test execution and teardown so regressions have evidence.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: >-
          uv run pytest --cov --cov-report=xml --cov-report=term --durations=20
          --test-profile=test-results/offline-profile.json
          --junitxml=test-results/offline.xml
        env:
          PYTHONUNBUFFERED: "1"
          HYPOTHESIS_PROFILE: ci
      - name: Summarize test timing
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results/offline-profile.json ]; then
            uv run python scripts/summarize_test_profile.py test-results/offline-profile.json --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-observability
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      # A warm cache must not conceal a missing locked artifact.
      - run: uv sync --locked --all-extras --no-cache
      - run: uv build --no-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  doc-links:
    # Advisory: keep it out of the required checks. It warns when a pull request
    # edits code that docs/ingest-pipeline.md cites, and fails only when a link is
    # wrong at its own pinned commit. The script uses only the standard library.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check reads files at each link's pinned commit and at the base branch.
          fetch-depth: 0
      - run: >-
          python3 scripts/check_doc_links.py check docs/ingest-pipeline.md
          --since "origin/$BASE_REF" --github
        env:
          BASE_REF: ${{ github.base_ref }}

  slow-tests:
    if: inputs.run_live_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Some live sort tests also have the browser marker.
      - run: uv run playwright install chromium --with-deps
      - run: uv run pytest -n 0 -m slow -v --force-enable-socket --timeout=120
        env:
          PYTHONUNBUFFERED: "1"

  browser-tests:
    if: inputs.run_browser_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install chromium --with-deps
      - run: uv run pytest -n 0 -m 'browser and not slow' -v --tracing=retain-on-failure
        env:
          PYTHONUNBUFFERED: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
