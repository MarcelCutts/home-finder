[project]
name = "model-comparison-experiment"
version = "0.1.0"
description = "Head-to-head Anthropic vs OpenAI comparison on the two-phase quality analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
    "home-finder",
    "openai>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
home-finder = { path = "../..", editable = true }
