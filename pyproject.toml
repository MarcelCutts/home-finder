[project]
name = "home-finder"
version = "0.1.0"
description = "Multi-platform London rental property scraper with commute filtering and Telegram notifications"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "crawlee[beautifulsoup]>=1.7.0,<2",
    "traveltimepy>=4.0",
    "aiogram>=3.30.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "curl-cffi>=0.15.0",
    "httpx>=0.27",
    "anthropic>=1.8.0,<2",
    "httpx2>=2.0.0,<3",
    "imagehash>=4.3.1",
    "Pillow>=12.3.0",
    "fastapi>=0.135.1",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "json-repair>=0.60.1",
    "python-multipart>=0.0.31",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "pytest-playwright>=0.6",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "mutmut>=3.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "inline-snapshot>=0.28",
    "dirty-equals>=0.6",
    "respx>=0.22",
]

[project.scripts]
home-finder = "home_finder.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short -p no:cacheprovider -m 'not slow and not browser' --disable-socket --allow-unix-socket --timeout=30 -n auto --dist=loadgroup"
timeout_func_only = true
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may use in-memory DB)",
    "slow: Slow tests (network, real scraping)",
    "e2e: End-to-end tests combining multiple pipeline stages",
    "browser: Browser-based E2E tests (requires Playwright)",
    "allow_hosts: Allow specific hosts for network access (pytest-socket)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/home_finder/web/routes.py" = ["B008"]  # FastAPI Depends() in defaults
"src/home_finder/web/filters.py" = ["B008"]  # FastAPI Query() in defaults
"tests/integration/*.py" = ["E402"]  # imports after pytestmark for Crawlee state reset
"tests/test_filters/test_quality_prompts.py" = ["E501", "RUF001"]  # inline-snapshot strings

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["experiments/", "mutants/"]

[[tool.mypy.overrides]]
module = ["tests.*", "tests.*.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "json_repair.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/home_finder"]
branch = true
relative_files = true
omit = [
    "src/home_finder/logging.py",
    "src/home_finder/data/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]

[tool.mutmut]
paths_to_mutate = [
    "src/home_finder/filters/scoring.py",
    "src/home_finder/filters/location.py",
    "src/home_finder/utils/address.py",
]
also_copy = ["src/"]
pytest_add_cli_args = [
    "-o", "addopts=--tb=short -q --capture=sys -p no:cacheprovider --hypothesis-profile=mutmut --ignore=tests/integration --ignore=tests/test_property_based.py --ignore=tests/test_db --ignore=tests/test_web --ignore=tests/test_notifiers --ignore=tests/test_scrapers",
]
pytest_add_cli_args_test_selection = ["-m", "not slow and not browser"]

[tool.uv]
package = true
# Security floors for transitive dependencies.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "click>=8.3.3",
    "idna>=3.15",
    "lxml>=6.1.0",
    "protego>=0.6.2",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "soupsieve>=2.9.0",
    "urllib3>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_finder"]

[tool.hatch.build.targets.sdist]
# Keep local logs, research exports and agent notes out of release artifacts.
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
